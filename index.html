
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discord PFP</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#111;color:white;font-family:Arial;display:flex;align-items:center;justify-content:center}
#avatar{width:300px;height:300px;object-fit:cover;border-radius:50%;display:none}
#error{display:none;text-align:center}
</style>
</head>
<body>

<img id="avatar">
<div id="error"></div>

<script>
const params = new URLSearchParams(location.search)
let path = params.get("p")

if (path) {
  history.replaceState(null,"",path)
}

const parts = location.pathname.split("/").filter(Boolean)
const id = parts[parts.length - 1]

const avatar = document.getElementById("avatar")
const error = document.getElementById("error")

if (!/^\d{17,20}$/.test(id)) {
  error.textContent = "Enter a Discord User ID"
  error.style.display = "block"
} else {
  fetch(`https://discord.com/api/v10/users/${id}`)
    .then(r => {
      if (!r.ok) throw new Error()
      return r.json()
    })
    .then(user => {
      if (!user.avatar) throw new Error()

      const extension = user.avatar.startsWith("a_") ? "gif" : "png"

      avatar.src =
        `https://cdn.discordapp.com/avatars/${id}/${user.avatar}.${extension}?size=1024`

      avatar.onload = () => {
        avatar.style.display = "block"
      }

      document.title = `${user.username}'s Discord PFP`
    })
    .catch(() => {
      error.textContent = "Discord user not found"
      error.style.display = "block"
    })
}
</script>

</body>
</html>

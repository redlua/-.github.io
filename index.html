
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discord PFP</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#111;
  color:white;
  font-family:Arial;
  display:flex;
  align-items:center;
  justify-content:center;
}
#avatar{
  width:300px;
  height:300px;
  object-fit:cover;
  border-radius:50%;
  display:none;
}
#error{
  text-align:center;
}
</style>
</head>
<body>

<img id="avatar">
<div id="error">Loading...</div>

<script>
const id = new URLSearchParams(location.search).get("id")
const avatar = document.getElementById("avatar")
const error = document.getElementById("error")

if (!/^\d{17,20}$/.test(id || "")) {
  error.textContent = "Invalid Discord User ID"
} else {
  fetch("https://discord.com/api/v10/users/" + id)
    .then(response => {
      if (!response.ok) throw new Error()
      return response.json()
    })
    .then(user => {
      if (!user.avatar) throw new Error()

      const extension = user.avatar.startsWith("a_")
        ? "gif"
        : "png"

      avatar.src =
        "https://cdn.discordapp.com/avatars/" +
        id + "/" +
        user.avatar +
        "." +
        extension +
        "?size=1024"

      avatar.onload = () => {
        error.style.display = "none"
        avatar.style.display = "block"
      }

      document.title = user.username + "'s Discord PFP"
    })
    .catch(() => {
      error.textContent =
        "Couldn't retrieve this Discord user's avatar."
    })
}
</script>

</body>
</html>

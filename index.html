```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discord PFP</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,sans-serif;
}

#avatar{
  width:300px;
  height:300px;
  object-fit:cover;
  border-radius:50%;
  display:none;
}

#error{
  color:white;
  text-align:center;
  font-size:18px;
}
</style>
</head>

<body>

<div id="error">Loading...</div>
<img id="avatar">

<script>
const id = new URLSearchParams(location.search).get("id")

const avatar = document.getElementById("avatar")
const error = document.getElementById("error")

console.log("Discord PFP")
console.log("User ID:", id)

if (!/^\d{17,20}$/.test(id || "")) {

  console.error("Invalid Discord User ID:", id)

  error.textContent = "Invalid Discord User ID"

} else {

  const url =
    "https://discord.tsunstudio.pw/api/pfp/" +
    id +
    "/image?size=1024"

  console.log("Avatar API:", url)

  avatar.src = url

  avatar.onload = () => {

    console.log("Avatar loaded successfully!")

    error.style.display = "none"
    avatar.style.display = "block"
  }

  avatar.onerror = () => {

    console.error("Avatar API failed:", url)

    error.textContent =
      "Couldn't retrieve this Discord user's avatar."
  }
}
</script>

</body>
</html>
```

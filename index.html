<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discord PFP</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
}

#avatar{
  width:300px;
  height:300px;
  object-fit:cover;
  border-radius:50%;
  display:none;
}

#error{
  text-align:center;
  white-space:pre-wrap;
}
</style>
</head>

<body>

<div id="error">Loading...</div>
<img id="avatar" alt="Discord Avatar">

<script>
const params = new URLSearchParams(location.search)
const id = params.get("id")

const avatar = document.getElementById("avatar")
const error = document.getElementById("error")

console.log("========== DISCORD PFP ==========")
console.log("Current URL:", location.href)
console.log("Discord User ID:", id)

if (!/^\d{17,20}$/.test(id || "")) {

  console.error("Invalid Discord User ID")

  error.textContent = "Invalid Discord User ID"

} else {

  const api =
    "https://discordpfp.vercel.app/api/avatar?id=" +
    encodeURIComponent(id)

  console.log("Using API:", api)

  error.textContent = "Loading avatar..."

  avatar.onload = () => {

    console.log("SUCCESS: Avatar loaded")

    error.style.display = "none"
    avatar.style.display = "block"
  }

  avatar.onerror = () => {

    console.error("FAILED: Avatar could not be loaded")
    console.error("API:", api)

    error.textContent =
      "Couldn't retrieve this Discord user's avatar.\n\n" +
      "API request failed."
  }

  avatar.src = api
}
</script>

</body>
</html>

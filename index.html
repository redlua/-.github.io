```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discord PFP</title>
<style>
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
}

#container{
  text-align:center;
  max-width:700px;
  padding:20px;
}

#avatar{
  width:300px;
  height:300px;
  object-fit:cover;
  border-radius:50%;
  display:none;
}

#error{
  white-space:pre-wrap;
  font-family:monospace;
  font-size:14px;
  text-align:left;
  word-break:break-word;
}

#status{
  margin-bottom:20px;
}
</style>
</head>

<body>

<div id="container">

  <div id="status">Loading...</div>

  <img id="avatar" alt="Discord Avatar">

  <div id="error"></div>

</div>

<script>
const status = document.getElementById("status")
const avatar = document.getElementById("avatar")
const error = document.getElementById("error")

const params = new URLSearchParams(location.search)
const id = params.get("id")

console.log("========== DISCORD PFP SEARCHER ==========")
console.log("Current URL:", location.href)
console.log("User ID:", id)

if (!/^\d{17,20}$/.test(id || "")) {

  status.textContent = "Invalid Discord User ID"

  console.error("Invalid ID:", id)

} else {

  const apiUrl =
    "https://discord.tsunstudio.pw/api/pfp/" +
    encodeURIComponent(id) +
    "/bigimage"

  console.log("PFP API URL:", apiUrl)

  status.textContent = "Fetching avatar..."

  avatar.onload = function () {

    console.log("SUCCESS: Avatar loaded")
    console.log("Image URL:", avatar.src)

    status.textContent = ""

    error.textContent = ""

    avatar.style.display = "block"
  }

  avatar.onerror = function () {

    console.error("FAILED: Avatar image could not be loaded")

    status.textContent = "Failed to load avatar"

    error.textContent =
      "The PFP API did not return an image.\n\n" +
      "User ID:\n" + id + "\n\n" +
      "API:\n" + apiUrl + "\n\n" +
      "Open the API URL directly in your browser.\n" +
      "If it returns an error, the API service is unavailable."
  }

  avatar.src = apiUrl
}
</script>

</body>
</html>
```

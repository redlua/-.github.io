
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script>
const path = location.pathname
const base = "/discord-pfp-searcher.github.io"

if (path.startsWith(base + "/")) {
  const id = path.slice(base.length + 1)

  location.replace(
    base + "/?id=" + encodeURIComponent(id)
  )
} else {
  location.replace(base + "/")
}
</script>
</head>
<body>
</body>
</html>
